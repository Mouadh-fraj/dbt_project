version: 2

models:
  - name: customer_lifetime_value
    description: "Calculates the lifetime value of a customer based on their purchase history."
    columns:
      - name: customer_id
        description: "The unique identifier for the customer."
        tests:
          - not_null
          - unique
      - name: lifetime_value
        description: "Estimated total revenue expected from a customer."

  - name: customer_total_spending
    description: "Aggregates the total amount each customer has spent."
    columns:
      - name: customer_id
        description: "The unique identifier for the customer."
        tests:
          - not_null
      - name: total_spent
        description: "The total amount spent by the customer."

  - name: product_sales_summary
    description: "Provides a summary of sales per product."
    columns:
      - name: product_id
        description: "The unique identifier for the product."
        tests:
          - not_null
          - unique
      - name: total_sales
        description: "Total revenue generated by the product."
      - name: total_units_sold
        description: "Total number of units sold for the product."
